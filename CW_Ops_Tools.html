<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>COWRKS Ops Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
.view{display:none}.view.active{display:block}
:root{--navy:#0E2742;--navy-2:#14375E;--orange:#E8772C;--green:#2E9E6B;--green-bg:#e8f4ed;--amber:#E0982E;--amber-bg:#fbf1de;--red:#D2473A;--red-bg:#fbe6e3;
--grey-bg:#F4F6F8;--card:#fff;--ink:#16263A;--muted:#62748A;--hair:#e4e9ee;--shadow:0 1px 2px rgba(16,39,66,.06),0 4px 16px rgba(16,39,66,.05);
--display:'Space Grotesk',system-ui,sans-serif;--body:'Inter',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}html,body{overflow-x:hidden}
body{font-family:var(--body);background:var(--grey-bg);color:var(--ink);font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased;line-height:1.45}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:var(--navy);color:#cdd8e4;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#2a4e74 transparent}
.side .logo-wrap{padding:0 20px 20px;border-bottom:1px solid #1d3c5e;margin-bottom:16px}
.side .logo{height:20px;display:block}.side .logo-sub{font-size:11px;color:#7d93ab;margin-top:8px;font-family:var(--display);font-weight:500}
.navgroup{padding:0 12px;margin-bottom:14px}
.navgroup .gl{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#62809e;padding:0 10px;margin-bottom:8px}
.navgroup .gl.sub{font-size:11px;letter-spacing:.04em;text-transform:none;color:#9db6cf;font-family:var(--display);margin:10px 0 4px}
.navitem{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;font-size:13.5px;font-weight:500;color:#cdd8e4;cursor:pointer;margin-bottom:2px;border:none;background:none;width:100%;text-align:left;transition:background .13s ease}
.navitem:hover{background:#16365a;color:#fff}.navitem.active{background:var(--orange);color:#fff;font-weight:600}
.navitem svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.8;fill:none;flex:none}
.navitem.sv{font-size:12.5px;padding:6px 11px 6px 20px;color:#a9bccf;line-height:1.3}
.navitem.sv small{display:block;font-size:10.5px;color:#7d93ab}
.navitem.sv.active small{color:#fff}
.navitem .rg{width:8px;height:8px;border-radius:50%;margin-left:auto;flex:none}
.rg.g{background:var(--green)}.rg.a{background:var(--amber)}.rg.r{background:var(--red)}.rg.n{background:#4d6782}
.navitem .cnt{margin-left:auto;font-size:11px;background:#28425f;border-radius:10px;padding:1px 7px;font-weight:600}
.navitem.active .cnt{background:rgba(255,255,255,.25)}
.side .foot{margin-top:auto;padding:16px 22px 4px;border-top:1px solid #1d3c5e;font-size:11px;color:#7d93ab;line-height:1.5}
.side .foot b{color:#cdd8e4;display:block;font-family:var(--display)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:18px 30px;background:#fff;border-bottom:1px solid var(--hair);position:sticky;top:0;z-index:20}
.topbar h1{font-family:var(--display);font-size:19px;font-weight:600;color:var(--navy);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .crumb{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:#fff;color:var(--navy);border:1px solid var(--hair);border-radius:9px;padding:9px 15px;font-family:var(--display);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;transition:background .15s ease,border-color .15s ease}
.btn:hover{background:var(--grey-bg);border-color:var(--navy-2)}
.btn svg{width:15px;height:15px;stroke:var(--orange);stroke-width:2;fill:none}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.primary:hover{background:#16406e}
.btn.danger{color:#9e2f25}.btn.sm{padding:6px 11px;font-size:12px}
.topbar .first{margin-left:auto}
.content{padding:28px 30px 80px;max-width:1500px}
.toast{position:fixed;bottom:26px;right:26px;max-width:380px;background:var(--navy);color:#fff;border-radius:12px;padding:14px 18px;box-shadow:0 10px 30px rgba(0,0,0,.28);font-size:13px;z-index:500;opacity:0;transform:translateY(10px);transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:none}.toast.err{background:var(--red)}.toast b{display:block;font-family:var(--display);margin-bottom:2px}
.sec{margin-bottom:30px}
.sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sec-head h2{font-family:var(--display);font-size:16px;font-weight:600;color:var(--navy)}
.sec-head .eye{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--orange)}
.sec-head .note{font-size:12.5px;color:var(--muted);margin-left:auto}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin:0 0 20px}
.lg{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
.dot{width:11px;height:11px;border-radius:3px;display:inline-block}
.dot.g{background:var(--green)}.dot.a{background:var(--amber)}.dot.r{background:var(--red)}.dot.n{background:#cfd8e0}.dot.o{background:#5B7CA6}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:26px}
.kpi{background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.kpi .num{font-family:var(--display);font-size:30px;font-weight:600;line-height:1;color:var(--navy);letter-spacing:-.02em}
.kpi .num small{font-size:15px;color:var(--muted);font-weight:500}
.kpi .lbl{font-size:12px;color:var(--muted);margin-top:8px}
.kpi.bar-g{border-top:3px solid var(--green)}.kpi.bar-a{border-top:3px solid var(--amber)}.kpi.bar-r{border-top:3px solid var(--red)}.kpi.bar-n{border-top:3px solid var(--navy)}.kpi.bar-x{border-top:3px solid #cfd8e0}
.card{background:var(--card);border:1px solid var(--hair);border-radius:14px;box-shadow:var(--shadow);padding:20px 22px}
.card h3{font-family:var(--display);font-size:14px;font-weight:600;color:var(--navy);margin-bottom:4px}
.cap{font-size:12px;color:var(--muted);margin-bottom:14px}
.rag{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 9px;border-radius:20px;white-space:nowrap}
.rag.g{background:var(--green-bg);color:#1d6e49}.rag.a{background:var(--amber-bg);color:#9a6914}.rag.r{background:var(--red-bg);color:#9e2f25}.rag.n{background:#eef2f5;color:#7e8b98}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;white-space:nowrap}
.badge.ho{background:#e2f0fb;color:#1f6aa6}.badge.au{background:#f0e9f6;color:#6b4f93}.badge.dr{background:#eef2f5;color:#5f7186}.badge.dn{background:var(--green-bg);color:#1d6e49}
.badge.ov{background:#e8eef6;color:#3d5f88}.badge.op{background:var(--red-bg);color:#9e2f25}.badge.cl{background:var(--green-bg);color:#1d6e49}
.t-g{color:#1d6e49}.t-a{color:#9a6914}.t-r{color:#9e2f25}.t-n{color:#9aa7b3}
/* survey cards */
.scards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.scard{background:var(--card);border:1px solid var(--hair);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;cursor:pointer;transition:box-shadow .15s,transform .12s}
.scard:hover{box-shadow:0 8px 26px rgba(16,39,66,.12);transform:translateY(-2px)}
.scard .ph{display:flex;align-items:center;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--hair)}
.scard .ph .ragdot{width:12px;height:12px;border-radius:50%;flex:none}
.scard .ph .nm{font-family:var(--display);font-weight:600;font-size:16px;color:var(--navy);line-height:1.2}
.scard .ph .nm small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
.scard .ph .badge{margin-left:auto}
.scard .pb{padding:14px 18px 16px}
.pstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.pstat{background:var(--grey-bg);border-radius:9px;padding:9px 10px}
.pstat .v{font-family:var(--display);font-weight:600;font-size:17px;color:var(--navy);line-height:1}
.pstat .k{font-size:10.5px;color:var(--muted);margin-top:5px;text-transform:uppercase;letter-spacing:.04em}
.stack{display:flex;height:10px;border-radius:6px;overflow:hidden;background:#eef2f5}
.stack span{height:100%}.stack .g{background:var(--green)}.stack .a{background:var(--amber)}.stack .r{background:var(--red)}
.meta{font-size:12px;color:var(--muted);margin-top:10px}
/* survey header */
.shead{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.shead .big{font-family:var(--display);font-size:25px;font-weight:600;color:var(--navy);line-height:1.2}
.shead .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.smeta{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:6px 0 22px}
.smeta b{color:var(--ink);font-weight:600}
.backlink{font-size:12.5px;color:var(--orange);font-weight:600;cursor:pointer;background:none;border:none;margin-bottom:10px}
/* floor + area rows */
.floor{margin-bottom:22px}
.floor .fh{display:flex;align-items:baseline;gap:10px;font-family:var(--display);font-size:13.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 10px 2px}
.floor .fh .fc{font-family:var(--body);text-transform:none;letter-spacing:normal;font-weight:500;font-size:12px}
.atable{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--hair);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.atable th{background:var(--navy-2);color:#fff;font-family:var(--display);font-weight:600;font-size:12px;padding:10px 12px;text-align:left;white-space:nowrap}
.atable th.r,.atable td.r{text-align:right}
.atable td{padding:11px 12px;font-size:13px;border-top:1px solid var(--hair);vertical-align:middle}
.atable tr.clk{cursor:pointer}.atable tr.clk:hover td{background:#f8fafb}
.atable td.nm{font-family:var(--display);font-weight:600;color:var(--navy)}
.atable td.nm small{display:block;font-family:var(--body);font-weight:400;font-size:11.5px;color:var(--muted)}
.atable td.lux{font-family:var(--display);font-weight:700;font-size:15px}
.meterbar{position:relative;height:8px;background:#eef2f5;border-radius:5px;width:120px;display:inline-block;vertical-align:middle}
.meterbar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.meterbar i.g{background:var(--green)}.meterbar i.a{background:var(--amber)}.meterbar i.r{background:var(--red)}.meterbar i.n{background:#cfd8e0}
.meterbar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--navy);left:66.6%}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:14px}
.empty{background:#fff;border:1px dashed #cdd6df;border-radius:14px;padding:30px;text-align:center;color:var(--muted);font-size:13.5px}
.empty b{display:block;font-family:var(--display);color:var(--navy);font-size:15px;margin-bottom:6px}
.empty .btn{margin-top:14px}
.fbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.fbar .fl{font-size:11.5px;font-weight:600;color:var(--muted)}
.fsel,.finp{font-size:12.5px;color:var(--ink);border:1px solid var(--hair);border-radius:8px;padding:7px 10px;background:#fff}
.fbar .cntr{margin-left:auto;font-size:12.5px;color:var(--muted)}
/* modal */
.mback{position:fixed;inset:0;background:rgba(8,20,36,.55);z-index:300;display:none}
.mback.show{display:block}
.modal{position:fixed;top:3vh;left:50%;transform:translateX(-50%);width:min(860px,94vw);max-height:94vh;background:#fff;border-radius:16px;box-shadow:0 30px 70px rgba(0,0,0,.35);z-index:301;display:none;flex-direction:column;overflow:hidden}
.modal.show{display:flex}
.mhead{display:flex;align-items:center;gap:12px;padding:18px 24px;border-bottom:1px solid var(--hair)}
.mhead h2{font-family:var(--display);font-size:17px;font-weight:600;color:var(--navy)}
.mclose{margin-left:auto;background:none;border:none;cursor:pointer;color:var(--muted);font-size:22px;line-height:1;padding:2px 8px;border-radius:6px}
.mclose:hover{background:var(--grey-bg)}
.mbody{overflow-y:auto;padding:18px 24px;flex:1}
.mfoot{display:flex;gap:10px;padding:14px 24px;border-top:1px solid var(--hair);flex-wrap:wrap}
.mfoot .sp{margin-left:auto}
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 14px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld.s2{grid-column:span 2}.fld.s4{grid-column:1/-1}
.fld label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
.fld input,.fld select,.fld textarea{font-size:14px;color:var(--ink);border:1px solid var(--hair);border-radius:8px;padding:9px 10px;background:#fff;width:100%}
.fld textarea{min-height:64px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--navy-2)}
.fld .hint{font-size:11.5px;color:var(--muted)}
.toggle{display:inline-flex;background:var(--grey-bg);border:1px solid var(--hair);border-radius:9px;padding:3px}
.tgl{border:none;background:none;font-family:var(--display);font-size:13px;font-weight:600;color:var(--muted);padding:7px 14px;border-radius:7px;cursor:pointer}
.tgl.active{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(16,39,66,.12)}
.readbox{background:#fbfcfd;border:1px solid var(--hair);border-radius:12px;padding:16px;margin-top:16px}
.readhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.readhead h3{font-family:var(--display);font-size:14px;color:var(--navy)}
.pts{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.pt{position:relative}
.pt span{position:absolute;top:5px;left:8px;font-size:10px;color:var(--muted);font-weight:600}
.pt input{width:100%;font-family:var(--display);font-size:20px;font-weight:600;text-align:center;border:1px solid var(--hair);border-radius:9px;padding:18px 6px 8px;background:#fff;color:var(--navy)}
.pt input:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(232,119,44,.15)}
.pt input.lo{background:var(--red-bg);border-color:#efb7af}.pt input.mid{background:var(--amber-bg);border-color:#f0d29d}
.pt button{position:absolute;top:2px;right:3px;border:none;background:none;color:#9aa7b3;cursor:pointer;font-size:14px;line-height:1;padding:2px 4px}
.single input{font-family:var(--display);font-size:34px;font-weight:600;text-align:center;border:1px solid var(--hair);border-radius:12px;padding:14px;width:220px;color:var(--navy)}
.live{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.live div{background:#fff;border:1px solid var(--hair);border-radius:9px;padding:9px 10px}
.live b{display:block;font-family:var(--display);font-size:18px;color:var(--navy)}
.live span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.gridhelp{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:12px}
.gridhelp input{width:70px;border:1px solid var(--hair);border-radius:7px;padding:6px 8px;font-size:13px}
.photos{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.photo{position:relative;width:96px;height:96px;border-radius:10px;overflow:hidden;border:1px solid var(--hair);background:#eef2f5}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo button{position:absolute;top:4px;right:4px;background:rgba(14,39,66,.75);color:#fff;border:none;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:13px;line-height:1}
.addph{width:96px;height:96px;border-radius:10px;border:1px dashed #b7c3cf;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:11.5px;cursor:pointer}
.addph svg{width:20px;height:20px;stroke:var(--orange);stroke-width:2;fill:none}
.subhd{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:20px 0 10px;padding-top:16px;border-top:1px solid var(--hair)}
.stbl input,.stbl select{font-size:12.5px;border:1px solid var(--hair);border-radius:7px;padding:6px 8px;width:100%}
.hintp{font-size:12px;color:var(--muted);line-height:1.55;margin-top:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.cmp{font-size:11.5px;font-weight:600;margin-left:4px}
/* report */
#report{display:none}
.rep{background:#fff;max-width:900px;margin:0 auto;border:1px solid var(--hair);border-radius:14px;padding:34px 38px;box-shadow:var(--shadow)}
.rep .rtop{display:flex;align-items:center;gap:14px;border-bottom:3px solid var(--navy);padding-bottom:14px;margin-bottom:18px}
.rep .rtop img{height:22px}
.rep .rtop .rt{margin-left:auto;text-align:right;font-family:var(--display);font-weight:600;color:var(--navy);font-size:18px}
.rep .rtop .rt small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted)}
.rep h2{font-family:var(--display);font-size:15px;color:var(--navy);margin:22px 0 10px}
.rep .rmeta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 18px;font-size:12.5px}
.rep .rmeta div span{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.rep .rk{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:16px}
.rep .rk div{border:1px solid var(--hair);border-radius:10px;padding:10px 12px}
.rep .rk b{display:block;font-family:var(--display);font-size:22px;color:var(--navy)}
.rep .rk span{font-size:11px;color:var(--muted)}
.rep table{width:100%;border-collapse:collapse;font-size:11.5px}
.rep th{background:var(--navy-2);color:#fff;text-align:left;padding:6px 8px;font-family:var(--display);font-weight:600}
.rep th.r,.rep td.r{text-align:right}
.rep td{padding:6px 8px;border-bottom:1px solid var(--hair);vertical-align:top}
.rep tr.fl td{background:#eef2f6;font-weight:600;color:var(--navy);font-family:var(--display)}
.rep .issue{border:1px solid var(--hair);border-radius:10px;padding:12px 14px;margin-bottom:10px;break-inside:avoid}
.rep .issue .ih{display:flex;gap:10px;align-items:center;font-family:var(--display);font-weight:600;color:var(--navy)}
.rep .issue .ih .rag{margin-left:auto}
.rep .issue p{font-size:12px;margin-top:6px}
.rep .issue .photos .photo{width:120px;height:90px}
.rep .sign{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:30px}
.rep .sign div{border-top:1px solid var(--ink);padding-top:6px;font-size:11.5px;color:var(--muted);height:70px}
.rep .method{font-size:11px;color:var(--muted);line-height:1.5}
/* mobile */
.menu-toggle{display:none;align-items:center;justify-content:center;width:38px;height:38px;border:1px solid var(--hair);background:#fff;border-radius:9px;cursor:pointer;flex:none}
.menu-toggle svg{width:20px;height:20px;stroke:var(--navy);stroke-width:2;fill:none}
.backdrop{display:none}
@media(max-width:1200px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:820px){
 .app{grid-template-columns:1fr}.menu-toggle{display:inline-flex}
 .side{position:fixed;top:0;left:0;bottom:0;width:250px;transform:translateX(-100%);transition:transform .26s cubic-bezier(.4,0,.2,1);z-index:60;box-shadow:0 0 44px rgba(0,0,0,.34)}
 .side.open{transform:none}
 .backdrop{display:block;position:fixed;inset:0;background:rgba(8,20,36,.5);z-index:55;opacity:0;visibility:hidden;transition:opacity .22s}
 .backdrop.show{opacity:1;visibility:visible}

<script>
const CENTRE_LIST=["Bengaluru - Centennial", "Bengaluru - Centennial 501", "Bengaluru - Centennial D", "Bengaluru - Ecospace 3B", "Bengaluru - Ecoworld 4D", "Bengaluru - Ecoworld 6A", "Bengaluru - Ecoworld 6B", "Bengaluru - New Indiranagar", "Bengaluru - Residency Road", "Bengaluru - Whitefield", "Bengaluru - Yelahanka", "Chennai - OMR 3A", "Chennai - OMR 3B 5F", "Chennai - OMR 3B 6F", "Chennai - Sterling Technopolis", "Hyderabad - Skyview", "Mumbai - Equinox BKC", "Mumbai - One Boulevard", "Mumbai - Prudential, Powai", "Mumbai - Spectra", "Mumbai - Winchester", "Mumbai - Worli", "NCR - Aerocity WM1", "NCR - Atelier Suites WM3", "NCR - Atelier WM2", "NCR - Candor Techspace Noida", "NCR - Cybercity", "NCR - Golf Course Road", "NCR - Noida Sector 135", "NCR - Noida Sector 62", "NCR - Worldmark 2 Asset 8", "Pune - 45ICON"];
'use strict';
/* ================= utils ================= */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const isoToday=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const pretty=s=>{if(!s)return '–';const d=new Date(s);return isNaN(d)?s:d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})};
const f0=v=>v==null||isNaN(v)?'–':Math.round(v).toLocaleString('en-IN');
const f2=v=>v==null||isNaN(v)?'–':v.toFixed(2);
let tT;function toast(t,m,err){const x=$('#toast');x.innerHTML='<b>'+esc(t)+'</b>'+esc(m||'');x.className='toast show'+(err?' err':'');clearTimeout(tT);tT=setTimeout(()=>x.className='toast',err?6500:4200)}

/* ================= reference targets =================
   Indicative maintained illuminance (Em, lux) and uniformity (Uo = Emin/Eavg) for office
   tasks, in line with EN 12464-1 and IS 3646. Edit them in Settings to match the project spec. */
const DEFAULT_TYPES=[
 ['ws','Open office / workstations',500,0.6],['cabin','Cabin / private office',500,0.6],['meet','Meeting / conference room',500,0.6],
 ['train','Training room',500,0.6],['recep','Reception',300,0.6],['booth','Phone booth / focus room',300,0.4],
 ['pantry','Pantry / breakout / café',200,0.5],['print','Print & copy area',300,0.4],['server','Server / IT room',300,0.4],
 ['wash','Washroom',200,0.4],['corr','Corridor / circulation',100,0.4],['lobby','Lift lobby',100,0.4],
 ['stair','Staircase',100,0.4],['store','Store room',100,0.4],['park','Parking',75,0.4]
].map(([k,l,em,uo])=>({k,l,em,uo}));

/* ================= store ================= */
const KEY='lux.v1';
let DB=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||null}catch(e){return null}})()||{surveys:[],types:DEFAULT_TYPES,settings:{amberPct:85,overPct:200,surveyor:'',meter:'',serial:'',cal:''}};
DB.types=DB.types&&DB.types.length?DB.types:DEFAULT_TYPES;
DB.settings=Object.assign({amberPct:85,overPct:200,surveyor:'',meter:'',serial:'',cal:''},DB.settings||{});
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));return true}catch(e){toast('Could not save','Browser storage is full. Export a backup and remove old surveys.',true);return false}}
const TYPE=k=>DB.types.find(t=>t.k===k)||{k,l:k,em:300,uo:0.4};

/* photos live in IndexedDB so they don't fill up local storage */
let idb;
function idbOpen(){return new Promise((res,rej)=>{if(idb)return res(idb);const r=indexedDB.open('luxPhotos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>{idb=r.result;res(idb)};r.onerror=()=>rej(r.error)})}
async function phPut(id,data){const d=await idbOpen();return new Promise((res,rej)=>{const t=d.transaction('p','readwrite');t.objectStore('p').put(data,id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function phGet(id){const d=await idbOpen();return new Promise(res=>{const r=d.transaction('p').objectStore('p').get(id);r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null)})}
async function phDel(id){const d=await idbOpen();return new Promise(res=>{const t=d.transaction('p','readwrite');t.objectStore('p').delete(id);t.oncomplete=res;t.onerror=res})}
function compress(file){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{const m=1000,s=Math.min(1,m/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.72))};img.onerror=rej;img.src=u})}
async function fillPhotos(root){for(const im of $$('img[data-ph]',root||document)){if(im.src&&im.src.startsWith('data:'))continue;const d=await phGet(im.dataset.ph);if(d)im.src=d}}

/* ================= calculations ================= */
function calc(a){
  const pts=(a.points||[]).map(Number).filter(v=>!isNaN(v)&&v!==null&&v!=='' );
  const t=TYPE(a.type);const em=a.em!=null&&a.em!==''?+a.em:t.em;const uoT=a.uo!=null&&a.uo!==''?+a.uo:t.uo;
  const r={n:pts.length,em,uoT,avg:null,min:null,max:null,uo:null,rAvg:'n',rUo:null,res:'n',comp:null,over:false};
  if(!pts.length)return r;
  r.avg=pts.reduce((x,y)=>x+y,0)/pts.length;r.min=Math.min(...pts);r.max=Math.max(...pts);
  const A=DB.settings.amberPct/100;
  r.rAvg=r.avg>=em?'g':r.avg>=em*A?'a':'r';
  if(a.mode==='grid'&&pts.length>=2&&r.avg>0){r.uo=r.min/r.avg;r.rUo=r.uo>=uoT?'g':r.uo>=uoT*A?'a':'r'}
  const rank={g:0,a:1,r:2};r.res=r.rUo&&rank[r.rUo]>rank[r.rAvg]?r.rUo:r.rAvg;
  const sr=(a.srcs||[]).slice(0,(a.points||[]).length);r.cam=sr.filter(x=>x==='c'||x==='b').length;const rough=sr.includes('b');r.src=!r.cam?'Typed in':r.cam===sr.length?(rough?'Camera (rough)':'Camera'):'Mixed';
  r.comp=r.avg/em*100;r.over=r.avg>em*DB.settings.overPct/100;
  return r;
}
function sumSurvey(s){
  const o={areas:s.areas.length,g:0,a:0,r:0,n:0,open:0,comp:[]};
  s.areas.forEach(a=>{const c=calc(a);o[c.res]++;if(c.comp!=null)o.comp.push(Math.min(100,c.comp));if((c.res==='r'||c.res==='a')&&(a.actStatus||'Open')!=='Closed')o.open++});
  o.tested=o.g+o.a+o.r;o.pass=o.tested?o.g/o.tested*100:null;o.avgComp=o.comp.length?o.comp.reduce((x,y)=>x+y,0)/o.comp.length:null;
  o.rag=!o.tested?'n':o.r?'r':o.a?'a':'g';return o;
}
function methodOf(s){let c=0,b=0,m=0;s.areas.forEach(a=>(a.srcs||[]).slice(0,(a.points||[]).length).forEach(x=>x==='c'?c++:x==='b'?b++:m++));
  const parts=[];if(c)parts.push('Phone camera ('+c+')');if(b)parts.push('Phone camera, rough ('+b+')');if(m)parts.push('Typed in ('+m+')');return parts.join(' · ')||'Phone camera'}
const RW={g:'Pass',a:'Marginal',r:'Fail',n:'Not tested'};
const ragPill=r=>'<span class="rag '+r+'">'+RW[r]+'</span>';
/* EN 12464-1 grid: max spacing p = 0.2 × 5^log10(d), d = longer side (m) */
function gridFor(L,W){L=+L;W=+W;if(!(L>0)||!(W>0))return null;const d=Math.max(L,W);const p=Math.min(10,0.2*Math.pow(5,Math.log10(d)));
  const nx=Math.max(1,Math.ceil(L/p)),ny=Math.max(1,Math.ceil(W/p));return {p,nx,ny,n:nx*ny}}
function prevSurvey(s){return DB.surveys.filter(x=>x.id!==s.id&&x.centre===s.centre&&(x.date||'')<(s.date||'')).sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0]||null}
const akey=a=>(String(a.floor||'').trim()+'|'+String(a.name||'').trim()).toLowerCase();

/* ================= state & routing ================= */
const ST={view:'home',sid:null,f:{}};
function go(v,sid){if(v!=='live'&&CAM.ctx==='live'&&CAM.stream)camStop();if(v!=='sound'&&typeof SND!=='undefined'&&SND.stream)sndStop();if(typeof opsStop==='function')opsStop(v);ST.view=v;if(sid!==undefined)ST.sid=sid;render();window.scrollTo(0,0);$('#side').classList.remove('open');$('#backdrop').classList.remove('show')}
const cur=()=>DB.surveys.find(s=>s.id===ST.sid);
function render(){
  renderNav();
  const v=ST.view;$$('.view').forEach(x=>x.classList.toggle('active',x.id==='view-'+v));
  $$('.navitem[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v||(v==='survey'&&false)));
  const s=cur();
  const T={surveys:['Lighting surveys','All surveys'],survey:[s?s.centre:'Survey',s?(s.kind+' · '+pretty(s.date)):''],issues:['Open issues','Failed and marginal areas across all surveys'],live:['Lux meter','Real-time light level'],sound:['Sound meter','Real-time noise level, dB(A)'],home:['Ops tools','Field tools for COWRKS centres'],wifi:['Wi-Fi speed test','Download, upload and latency by zone'],level:['Level and slope','Level, ramp gradient and plumb'],vib:['Vibration meter','Floor and equipment vibration'],echo:['Room echo test','Reverberation time (RT60) from a clap'],settings:['Settings','Targets and defaults']};
  $('#vt').textContent=T[v][0];$('#vc').textContent=T[v][1];$('#newBtn').style.display=['surveys','survey','issues'].includes(v)?'':'none';
  document.title=T[v][0]+' · COWRKS Ops Tools';
  ({surveys:renderSurveys,survey:renderSurvey,issues:renderIssues,settings:renderSettings,live:renderLive,sound:renderSound,home:renderHome,wifi:renderWifi,level:renderLevel,vib:renderVib,echo:renderEcho})[v]($('#view-'+v));
}
function renderNav(){
  const by={};DB.surveys.forEach(s=>(by[s.centre]=by[s.centre]||[]).push(s));
  let h='<div class="gl">Surveys by centre</div>';
  Object.keys(by).sort().forEach(c=>{h+='<div class="gl sub">'+esc(c)+'</div>';
    by[c].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).forEach(s=>{const o=sumSurvey(s);
      h+='<button class="navitem sv'+(ST.view==='survey'&&ST.sid===s.id?' active':'')+'" data-open="'+s.id+'"><span>'+esc(s.kind)+'<small>'+pretty(s.date)+(s.floors?' · '+esc(s.floors):'')+'</small></span><span class="rg '+o.rag+'"></span></button>'})});
  if(!DB.surveys.length)h+='<div style="padding:0 10px;font-size:12px;color:#7d93ab">No surveys yet</div>';
  $('#navSurveys').innerHTML=h;
  const open=DB.surveys.reduce((n,s)=>n+sumSurvey(s).open,0);$('#issCnt').textContent=open||'';
}
function legend(){const A=DB.settings.amberPct;return '<div class="legend"><span class="lg"><span class="dot g"></span>Pass: meets target lux and uniformity</span><span class="lg"><span class="dot a"></span>Marginal: within '+A+'–100% of target</span><span class="lg"><span class="dot r"></span>Fail: below '+A+'% of target</span><span class="lg"><span class="dot n"></span>Not tested</span><span class="lg"><span class="dot o"></span>Over-lit: above '+DB.settings.overPct+'% of target</span></div>'}
const kpi=(l,v,bar,sub)=>'<div class="kpi bar-'+bar+'"><div class="num">'+v+'</div><div class="lbl">'+l+'</div>'+(sub?'<div class="lbl" style="margin-top:4px">'+sub+'</div>':'')+'</div>';
const kindBadge=k=>'<span class="badge '+(k==='Handover'?'ho':'au')+'">'+esc(k)+'</span>';

/* ================= surveys list ================= */
function renderSurveys(el){
  const f=ST.f.list||(ST.f.list={});
  let list=DB.surveys.filter(s=>(!f.kind||s.kind===f.kind)&&(!f.city||s.city===f.city)&&(!f.q||(s.centre+' '+(s.floors||'')+' '+(s.surveyor||'')).toLowerCase().includes(f.q.toLowerCase())));
  list.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const all=DB.surveys.map(sumSurvey);const tested=all.reduce((n,o)=>n+o.tested,0),g=all.reduce((n,o)=>n+o.g,0),r=all.reduce((n,o)=>n+o.r,0),open=all.reduce((n,o)=>n+o.open,0);
  const cities=[...new Set(DB.surveys.map(s=>s.city).filter(Boolean))].sort();
  let h=legend()+'<div class="kpis">'+kpi('Surveys',DB.surveys.length,'n',DB.surveys.filter(s=>s.kind==='Handover').length+' handover · '+DB.surveys.filter(s=>s.kind==='Audit').length+' audit')+
    kpi('Areas tested',tested,'n')+kpi('Pass rate',tested?Math.round(g/tested*100)+'<small>%</small>':'–',tested?(g/tested>=.9?'g':g/tested>=.75?'a':'r'):'x')+
    kpi('Failed areas',r,r?'r':'g')+kpi('Open issues',open,open?'a':'g','Failed or marginal, not closed')+'</div>';
  h+='<div class="fbar"><span class="fl">Type</span><select class="fsel" data-f="list.kind"><option value="">All</option>'+['Handover','Audit'].map(k=>'<option'+(f.kind===k?' selected':'')+'>'+k+'</option>').join('')+'</select>'+
    '<span class="fl">City</span><select class="fsel" data-f="list.city"><option value="">All</option>'+cities.map(c=>'<option'+(f.city===c?' selected':'')+'>'+esc(c)+'</option>').join('')+'</select>'+
    '<input class="finp" placeholder="Search centre, floor or surveyor" data-f="list.q" value="'+esc(f.q||'')+'"><span class="cntr">'+list.length+' survey'+(list.length===1?'':'s')+'</span></div>';
  if(!DB.surveys.length){el.innerHTML=h+'<div class="empty"><b>No surveys yet</b>Start a handover check or a periodic audit. Readings are typed in from a lux meter and saved on this device.<br><button class="btn primary" data-act="newSurvey">'+ICON.plus+'New survey</button></div>';return}
  h+='<div class="scards">'+list.map(s=>{const o=sumSurvey(s);const t=o.areas||1;
    return '<div class="scard" data-open="'+s.id+'"><div class="ph"><span class="ragdot" style="background:var(--'+(o.rag==='g'?'green':o.rag==='a'?'amber':o.rag==='r'?'red':'hair')+')"></span><div class="nm">'+esc(s.centre)+'<small>'+(s.floors?esc(s.floors)+' · ':'')+pretty(s.date)+'</small></div>'+kindBadge(s.kind)+'</div>'+
    '<div class="pb"><div class="pstats"><div class="pstat"><div class="v">'+o.areas+'</div><div class="k">Areas</div></div><div class="pstat"><div class="v t-g">'+o.g+'</div><div class="k">Pass</div></div><div class="pstat"><div class="v t-a">'+o.a+'</div><div class="k">Marginal</div></div><div class="pstat"><div class="v t-r">'+o.r+'</div><div class="k">Fail</div></div></div>'+
    '<div class="stack"><span class="g" style="width:'+o.g/t*100+'%"></span><span class="a" style="width:'+o.a/t*100+'%"></span><span class="r" style="width:'+o.r/t*100+'%"></span></div>'+
    '<div class="meta">'+(o.n?o.n+' not tested yet · ':'')+(o.open?o.open+' open issue'+(o.open>1?'s':'')+' · ':'')+'Surveyor: '+esc(s.surveyor||'–')+' · <span class="badge '+(s.status==='Completed'?'dn':'dr')+'">'+esc(s.status||'Draft')+'</span></div></div></div>'}).join('')+'</div>';
  el.innerHTML=h;
}

/* ================= survey detail ================= */
function renderSurvey(el){
  const s=cur();if(!s){go('surveys');return}
  const o=sumSurvey(s);const pv=prevSurvey(s);const pmap={};if(pv)pv.areas.forEach(a=>pmap[akey(a)]=calc(a));
  let h='<button class="backlink" data-view-go="surveys">← All surveys</button>';
  h+='<div class="shead"><div><div class="big">'+esc(s.centre)+'</div></div>'+kindBadge(s.kind)+' <span class="badge '+(s.status==='Completed'?'dn':'dr')+'">'+esc(s.status||'Draft')+'</span>'+

/* ================= open issues ================= */
function renderIssues(el){
  const f=ST.f.iss||(ST.f.iss={st:'Open'});
  const rows=[];DB.surveys.forEach(s=>s.areas.forEach(a=>{const c=calc(a);if(c.res==='r'||c.res==='a')rows.push({s,a,c})}));
  const list=rows.filter(x=>(!f.st||(x.a.actStatus||'Open')===f.st)&&(!f.kind||x.s.kind===f.kind)&&(!f.res||x.c.res===f.res)).sort((x,y)=>(x.c.res==='r'?0:1)-(y.c.res==='r'?0:1)||(x.a.due||'9').localeCompare(y.a.due||'9'));
  const today=isoToday();
  let h='<div class="fbar"><span class="fl">Status</span><select class="fsel" data-f="iss.st"><option value="">All</option>'+['Open','In progress','Closed'].map(k=>'<option'+(f.st===k?' selected':'')+'>'+k+'</option>').join('')+'</select>'+
    '<span class="fl">Result</span><select class="fsel" data-f="iss.res"><option value="">Fail and marginal</option><option value="r"'+(f.res==='r'?' selected':'')+'>Fail</option><option value="a"'+(f.res==='a'?' selected':'')+'>Marginal</option></select>'+
    '<span class="fl">Type</span><select class="fsel" data-f="iss.kind"><option value="">All</option>'+['Handover','Audit'].map(k=>'<option'+(f.kind===k?' selected':'')+'>'+k+'</option>').join('')+'</select><span class="cntr">'+list.length+' issue'+(list.length===1?'':'s')+'</span></div>';
  h+=list.length?'<div class="tscroll"><table class="atable"><thead><tr><th>Centre · area</th><th>Survey</th><th class="r">Lux</th><th>Result</th><th>Action</th><th>Owner</th><th>Due</th><th>Status</th></tr></thead><tbody>'+
    list.map(({s,a,c})=>'<tr class="clk" data-open="'+s.id+'" data-area2="'+a.id+'"><td class="nm">'+esc(s.centre)+'<small>'+esc(a.floor||'')+(a.floor?' · ':'')+esc(a.name)+'</small></td><td>'+kindBadge(s.kind)+'<div style="font-size:11.5px;color:var(--muted);margin-top:3px">'+pretty(s.date)+'</div></td>'+
      '<td class="r lux t-'+c.rAvg+'">'+f0(c.avg)+'<div style="font-size:11px;color:var(--muted);font-weight:400">target '+c.em+(c.uo!=null?' · Uo '+f2(c.uo):'')+'</div></td><td>'+ragPill(c.res)+'</td><td style="max-width:280px;font-size:12.5px">'+esc(a.action||'')+'</td><td>'+esc(a.owner||'')+'</td>'+
      '<td style="white-space:nowrap">'+(a.due?pretty(a.due)+((a.actStatus||'Open')!=='Closed'&&a.due<today?' <span class="badge op">Overdue</span>':''):'–')+'</td><td><span class="badge '+((a.actStatus||'Open')==='Closed'?'cl':'op')+'">'+esc(a.actStatus||'Open')+'</span></td></tr>').join('')+'</tbody></table></div>'
    :'<div class="empty"><b>No issues match</b>Failed and marginal areas appear here with their actions.</div>';
  el.innerHTML=h;
}

function surveyForm(s){
  MODE='survey';const st=DB.settings;const n=!s;

    fld('status','Status','s2','<select id="sf_status">'+['Draft','Completed'].map(c=>'<option'+(s.status===c?' selected':'')+'>'+c+'</option>').join('')+'</select>')+

    '<button class="btn" data-act="close">Cancel</button><button class="btn primary sp" data-act="saveSurvey">'+(n?'Create survey':'Save details')+'</button>');
  $('#modal').dataset.sid=n?'':s.id;setTimeout(()=>$('#sf_centre').focus(),50);

function saveSurvey(){
  const v=k=>{const e=$('#sf_'+k);return e?e.value.trim():''};
  if(!v('centre')){toast('Add the centre','Enter the centre or project name.',true);return}
  const id=$('#modal').dataset.sid;let s=id?DB.surveys.find(x=>x.id===id):null;
  if(!s){s={id:uid(),areas:[]};DB.surveys.push(s)}
  ['centre','kind','date','floors','surveyor','cond','status','notes'].forEach(k=>s[k]=v(k));
  s.city=s.centre.includes(' - ')?s.centre.split(' - ')[0].trim():'';
  save();closeModal();go('survey',s.id);
}

/* ================= camera light meter =================
   The phone lies flat at desk height, front camera facing the ceiling (incident light).
   Lux is estimated from the camera's exposure and the image brightness:
     EV100 = log2(N² / t) − log2(ISO / 100)            (N = assumed aperture, t = shutter in s)
     lux   ≈ 2.5 × 2^EV100 × (mean linear luminance / 0.18) × k
   k is a per-phone calibration factor set against a lux meter reading.
   Exposure must be readable (Chrome on Android). Where the camera allows manual exposure, the
   tool fixes ISO and shutter itself and auto-ranges, which is steadier than reading auto-exposure. */
const CAM={ctx:'area',stream:null,track:null,timer:null,mode:'none',facing:'user',hist:[],idx:0,t:null,iso:null,settleUntil:0,raw:null,val:null,caps:null};
const N_ASSUMED=1.8;
function roughMsg(){return '<b>Rough estimate</b>This device doesn\'t share camera exposure, so the reading comes from image brightness only. The camera adjusts itself to the light, so calibrate against a lux meter in similar lighting and treat readings as indicative.'}
function noExposureMsg(){const ua=navigator.userAgent;
  if(/iPhone|iPad/.test(ua))return '<b>iPhone can\'t measure light in a browser</b>Apple doesn\'t let web pages read the camera\'s exposure, in Safari or Chrome. Use an Android phone in Chrome, or type readings from a lux meter.';
  if(!/Android/.test(ua))return '<b>Laptop and desktop webcams can\'t measure light</b>They don\'t share exposure with the browser. Open the tool on an Android phone in Chrome, from your https (Vercel) link.';
  return '<b>This phone\'s camera doesn\'t share exposure</b>Some Android cameras don\'t report it to Chrome. Try Switch camera; if it still shows this, use a lux meter on this phone.';}

const calStore=()=>{try{return JSON.parse(localStorage.getItem('lux.cal')||'{}')}catch(e){return {}}};
const calKey=()=>(CAM.track&&CAM.track.label?CAM.track.label:'camera')+'|'+CAM.facing+'|'+(CAM.mode==='bright'?'b':'e');
const calK=()=>calStore()[calKey()]||null;
function srgbLin(c){c/=255;return c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4)}
const LIN=new Float32Array(256).map((_,i)=>srgbLin(i));
async function camOpen(idx){
  CAM.idx=idx;CAM.ctx='area';
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){camShell('<b>Camera not available</b>This browser does not allow camera access here. Open the tool over https (for example your Vercel link) in Chrome on Android.');return}
  camShell(null);await camStart();
}
async function camStart(){
  camStop(true);
  try{
    CAM.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:CAM.facing,width:{ideal:640},height:{ideal:480}},audio:false});
  }catch(e){camMsg('<b>Camera blocked</b>Allow camera access for this site in the browser settings, then try again.');return}
  CAM.track=CAM.stream.getVideoTracks()[0];
  const v=$(CAM.ctx==='live'?'#lvVideo':'#camVideo');if(v){v.srcObject=CAM.stream;try{await v.play()}catch(e){}}
  CAM.caps=CAM.track.getCapabilities?CAM.track.getCapabilities():{};
  const st=CAM.track.getSettings?CAM.track.getSettings():{};
  CAM.mode='none';CAM.hist=[];
  const c=CAM.caps;
  if(c.exposureMode&&c.exposureMode.includes('manual')&&c.exposureTime&&c.iso){
    CAM.mode='manual';CAM.iso=Math.max(c.iso.min,Math.min(c.iso.max,100));
    CAM.t=Math.max(c.exposureTime.min,Math.min(c.exposureTime.max,100)); // 100 × 100µs = 10 ms
    await camApply();
  }else if(st.exposureTime!=null&&st.iso!=null){CAM.mode='auto'}

}
async function camApply(){
  try{await CAM.track.applyConstraints({advanced:[{exposureMode:'manual',exposureTime:CAM.t,iso:CAM.iso}]})}catch(e){CAM.mode=(CAM.track.getSettings().exposureTime!=null)?'auto':'bright'}
  CAM.settleUntil=Date.now()+450;CAM.hist=[];
}
function camStop(keepShell){
  if(CAM.timer)clearInterval(CAM.timer);CAM.timer=null;
  if(CAM.stream)CAM.stream.getTracks().forEach(t=>t.stop());CAM.stream=null;CAM.track=null;
  if(!keepShell){$('#cam').classList.remove('show');$('#camBack').classList.remove('show')}

function camTick(){
  const v=$(CAM.ctx==='live'?'#lvVideo':'#camVideo');if(!v||!v.videoWidth||Date.now()<CAM.settleUntil)return;
  const cv=$('#camCanvas'),ctx=cv.getContext('2d',{willReadFrequently:true});ctx.drawImage(v,0,0,64,48);
  const d=ctx.getImageData(0,0,64,48).data;let sum=0,clip=0,n=0;
  for(let i=0;i<d.length;i+=4){sum+=0.2126*LIN[d[i]]+0.7152*LIN[d[i+1]]+0.0722*LIN[d[i+2]];if(d[i]>=250||d[i+1]>=250||d[i+2]>=250)clip++;n++}
  const Y=sum/n,clipF=clip/n;
  let t,iso;
  if(CAM.mode==='manual'){
    t=CAM.t;iso=CAM.iso;const c=CAM.caps;
    if((Y>0.55||clipF>0.02)&&t>c.exposureTime.min){CAM.t=Math.max(c.exposureTime.min,t/2);camApply();return}
    if(Y<0.06&&t<Math.min(c.exposureTime.max,2000)){CAM.t=Math.min(c.exposureTime.max,t*2);camApply();return}
  }else if(CAM.mode==='auto'){const s=CAM.track.getSettings();t=s.exposureTime;iso=s.iso}
  let raw;
  if(CAM.mode==='bright'){raw=Y*10000} // image brightness only (same basis as LuxCheck): rough, needs calibration
  else{
    if(!t||!iso||Y<=0){camLive(null,Y,clipF);return}
    const secs=t/10000; // MediaTrack exposureTime is in 100 µs units
    const ev=Math.log2(N_ASSUMED*N_ASSUMED/secs)-Math.log2(iso/100);

    heroLabel('vbLabel','Equipment or location, e.g. AHU-3 / Floor near DG room')+'<div class="cammode">Saved readings with the same label are compared, so you can track equipment over time.</div></div>'+
    '<div class="lvbelow"><div class="card"><svg id="vbChart" class="lvchart" viewBox="0 0 400 140" preserveAspectRatio="none"></svg><div class="lvcap">Last 60 seconds · dashed lines: noticeable (0.05) and high (0.15 m/s²)</div></div>'+
    logTable('vib','Saved readings',[{h:'Equipment / location',f:r=>esc(r.label||'')},{h:'RMS m/s²',r:1,f:r=>r.rms.toFixed(3)},{h:'Peak',r:1,f:r=>r.pk.toFixed(3)},{h:'Freq Hz',r:1,f:r=>r.fq?r.fq.toFixed(1):'–'},{h:'vs last',r:1,f:r=>r.chg==null?'–':'<span class="cmp '+(r.chg>20?'t-r':r.chg<-20?'t-g':'')+'">'+(r.chg>0?'+':'')+r.chg.toFixed(0)+'%</span>'},{h:'Level',f:r=>ragTxt(r.rag,{g:vBand(r.rms)[2],a:'Noticeable',r:'High'})}],'Use Measure 10 s for a consistent reading.')+
    '<div class="card"><h3>Reading the result</h3><div class="cap" style="margin:6px 0 0">RMS is the average vibration strength; peak is the strongest jolt. Phone sensors can\'t detect very small vibrations (below about 0.015 m/s²), so a quiet floor reads as "below phone sensitivity". The main frequency points to the source: fans and motors usually show a steady frequency that matches their running speed. Bands are indicative, for comparing locations and spotting change; they are not a compliance assessment.</div></div></div>';
  if(MOTION.handlers.has(vibEvt)){$('#vbIdle').style.display='none';$('#vbBtns').style.display='flex'}
}
function vibSave(timed){
  const s=timed&&VIB.acc.length?VIB.acc:(VIB.last?[VIB.last]:[]);if(!s.length){toast('No reading yet','Start the meter first.',true);return}
  const rms=Math.sqrt(s.reduce((t,v)=>t+v.rms*v.rms,0)/s.length),pk=Math.max(...s.map(v=>v.pk));const fqs=s.map(v=>v.fq).filter(Boolean).sort((a,b)=>a-b);const fq=fqs.length?fqs[Math.floor(fqs.length/2)]:null;
  const label=valOf('vbLabel');const prev=logGet('vib').filter(r=>r.label&&r.label.toLowerCase()===label.toLowerCase()).pop();
  const b=vBand(rms);logPush('vib',{label,rms:+rms.toFixed(4),pk:+pk.toFixed(4),fq:fq&&rms>0.015?+fq.toFixed(1):null,rag:b[1],band:b[2],chg:prev&&label?(rms-prev.rms)/prev.rms*100:null,secs:timed?10:1});
  VIB.acc=[];toast('Reading saved',rms.toFixed(3)+' m/s² · '+b[2]+(prev&&label?' · '+((rms-prev.rms)/prev.rms*100>0?'+':'')+((rms-prev.rms)/prev.rms*100).toFixed(0)+'% vs last':''));
  const v=$('#view-vib');const cards=v.querySelectorAll('.lvbelow>.card');cards[1].outerHTML=logTable('vib','Saved readings',[{h:'Equipment / location',f:r=>esc(r.label||'')},{h:'RMS m/s²',r:1,f:r=>r.rms.toFixed(3)},{h:'Peak',r:1,f:r=>r.pk.toFixed(3)},{h:'Freq Hz',r:1,f:r=>r.fq?r.fq.toFixed(1):'–'},{h:'vs last',r:1,f:r=>r.chg==null?'–':'<span class="cmp '+(r.chg>20?'t-r':r.chg<-20?'t-g':'')+'">'+(r.chg>0?'+':'')+r.chg.toFixed(0)+'%</span>'},{h:'Level',f:r=>ragTxt(r.rag,{g:vBand(r.rms)[2],a:'Noticeable',r:'High'})}],'');renderNav();
}
XCOLS.vib={sheet:'Vibration',file:'Vibration_Readings',cols:[['Equipment / location',r=>r.label],['RMS m/s2',r=>r.rms],['Peak m/s2',r=>r.pk],['Main frequency Hz',r=>r.fq||''],['Change vs last %',r=>r.chg==null?'':Math.round(r.chg)],['Level',r=>r.band],['Duration s',r=>r.secs]]};

/* ================= Room echo (reverberation time) =================
   Detect an impulse (clap or balloon pop), then measure how fast the sound energy decays.
   Schroeder backward integration of the noise-corrected energy envelope; RT60 from the
   −5 to −25 dB decay (T20 × 3), or −5 to −15 dB (T10 × 6) when the clap isn't loud enough. */
const EC={ctx:null,stream:null,proc:null,noise:null,state:'off',cap:[],pre:[],hits:[],cool:0,type:'meet',blk:128};
const ERW={g:'Good',a:'Slightly echoey',r:'Echoey',n:''};
const ETYPE=k=>DB.echoTypes.find(t=>t.k===k)||null;
function ecRag(rt){const t=ETYPE(EC.type);if(!t||rt==null)return 'n';return rt<=t.rt?'g':rt<=t.rt+0.2?'a':'r'}
function renderEcho(el){
  const t=ETYPE(EC.type);const avg=EC.hits.length?EC.hits.reduce((a,b)=>a+b.rt,0)/EC.hits.length:null;const r=ecRag(avg);
  el.innerHTML='<div class="hero"><div class="hero-top"><select class="hsel" id="ecType" aria-label="Room type">'+DB.echoTypes.map(x=>'<option value="'+x.k+'"'+(EC.type===x.k?' selected':'')+'>'+esc(x.l)+' · target ≤ '+x.rt+' s</option>').join('')+'</select></div>'+
    '<div class="lvnum"><span id="ecNum" class="t-'+(r==='n'?'none':r)+'">'+(avg!=null?avg.toFixed(2):'–')+'</span><small>seconds to fade (RT60)</small></div>'+
    '<div class="echits">'+[0,1,2].map(i=>'<div class="'+(EC.hits[i]?'on':'')+'"><b>'+(EC.hits[i]?EC.hits[i].rt.toFixed(2)+' s':'Clap '+(i+1))+'</b><span>'+(EC.hits[i]?EC.hits[i].m:'')+'</span></div>').join('')+'</div>'+
    '<div class="lvrow" style="margin-top:12px"><span class="camsteady" id="ecState">'+(EC.state==='off'?'Microphone off':'Listening for a clap…')+'</span><span class="rag '+r+'" id="ecRag">'+(r==='n'?'–':ERW[r])+'</span></div><div class="cammsg lvmsg" id="ecMsg"></div>'+
    '<div class="lvidle" id="ecIdle" style="display:'+(EC.state==='off'?'flex':'none')+'"><button class="btn go" data-ec="start">Start listening</button><div>Keep the room quiet with the door closed. Stand in the middle, hold the phone at arm\'s length, then clap once sharply (or pop a balloon). Do it three times.</div></div>'+
    '<div class="lvbtns" id="ecBtns" style="display:'+(EC.state==='off'&&!EC.hits.length?'none':'flex')+'"><button class="btn" data-ec="again">Start over</button><button class="btn go" data-ec="save">Save result</button><button class="btn" data-ec="stop">Stop</button></div>'+
    heroLabel('ecLabel','Room, e.g. MR 4.1 / Booth 3')+'</div>'+
    '<div class="lvbelow">'+logTable('ec','Saved results',[{h:'Room',f:r=>esc(r.label||'')+'<div style="font-size:11.5px;color:var(--muted)">'+esc(r.type)+'</div>'},{h:'RT60',r:1,f:r=>r.rt.toFixed(2)+' s'},{h:'Target',r:1,f:r=>'≤ '+r.target+' s'},{h:'Claps',r:1,f:r=>r.n},{h:'Result',f:r=>ragTxt(r.rag,ERW)}],'Average three claps, then save.')+
    '<div class="card"><h3>About this test</h3><div class="cap" style="margin:6px 0 0">RT60 is how long a sound takes to fade by 60 dB. Short times make speech clear on calls; long times make a room echoey. A clap is a quick, rough source, so take three and use the average; a balloon pop is louder and more reliable in larger rooms. If a clap shows "low signal", clap louder or reduce background noise (AC, fans). Results are indicative, for comparing rooms and spotting ones that need acoustic panels.</div></div></div>';
}
async function ecStart(){
  const msg=$('#ecMsg');
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){msg.innerHTML='<b>Microphone not available</b>Open the tool from its https link.';return}
  try{EC.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})}catch(e){msg.innerHTML='<b>Microphone blocked</b>Allow microphone access for this site, then try again.';return}
  const AC=window.AudioContext||window.webkitAudioContext;EC.ctx=new AC();if(EC.ctx.state==='suspended')await EC.ctx.resume();
  const src=EC.ctx.createMediaStreamSource(EC.stream);EC.proc=EC.ctx.createScriptProcessor(2048,1,1);src.connect(EC.proc);EC.proc.connect(EC.ctx.destination);
  EC.dt=EC.blk/EC.ctx.sampleRate;EC.noise=null;EC.state='listen';EC.pre=[];EC.cap=[];
  EC.proc.onaudioprocess=ev=>{const d=ev.inputBuffer.getChannelData(0);ev.outputBuffer.getChannelData(0).fill(0);for(let i=0;i+EC.blk<=d.length;i+=EC.blk){let s=0;for(let j=i;j<i+EC.blk;j++)s+=d[j]*d[j];ecBlock(s/EC.blk+1e-12)}};
  $('#ecIdle').style.display='none';$('#ecBtns').style.display='flex';$('#ecState').textContent='Measuring background…';msg.innerHTML='';
}
function ecBlock(e){
  const db=10*Math.log10(e);
  if(EC.state==='listen'){
    EC.pre.push(e);if(EC.pre.length>40)EC.pre.shift();
    if(Date.now()<EC.cool)return;
    if(EC.noise==null){if(EC.pre.length>=40){EC.noise=EC.pre.slice().sort((a,b)=>a-b)[20];ecUI('Listening for a clap…')}return}
    if(db>10*Math.log10(EC.noise)+25){EC.state='cap';EC.cap=[e];return}
    EC.noise=EC.noise*0.995+Math.min(e,EC.noise*4)*0.005;
  }else if(EC.state==='cap'){EC.cap.push(e);if(EC.cap.length*EC.dt>=1.6){EC.state='listen';EC.cool=Date.now()+1200;ecAnalyse(EC.cap.slice())}}
}
function ecAnalyse(cap){
  let pi=0;for(let i=1;i<Math.min(cap.length,60);i++)if(cap[i]>cap[pi])pi=i;
  const tail=cap.slice(-Math.floor(cap.length*0.2));const En=Math.max(EC.noise,tail.reduce((a,b)=>a+b,0)/tail.length);
  const dr=10*Math.log10(cap[pi]/En);
  let end=cap.length;for(let i=pi;i<cap.length;i++){if(cap[i]<En*2){end=i;break}}
  const e=cap.slice(pi,end).map(v=>Math.max(0,v-En));if(e.length<6){ecUI(null,'<b>Didn\'t catch that</b>Clap again, sharply.');return}
  const S=new Array(e.length);let acc=0;for(let i=e.length-1;i>=0;i--){acc+=e[i];S[i]=acc}
  const L=S.map(v=>10*Math.log10(v/S[0]));const at=th=>{const i=L.findIndex(v=>v<=th);return i<0?null:i*EC.dt};
  const t5=at(-5),t25=at(-25),t15=at(-15);let rt,m;
  if(t5!=null&&t25!=null&&dr>=35){rt=3*(t25-t5);m='T20'}else if(t5!=null&&t15!=null){rt=6*(t15-t5);m='Low signal'}
  if(!rt||rt<0.05||rt>4){ecUI(null,'<b>Clap not clear enough</b>'+(dr<25?'Clap louder, or reduce background noise.':'Try again.'));return}
  EC.hits.push({rt,m,dr});if(EC.hits.length>3)EC.hits.shift();
  renderEcho($('#view-echo'));ecUI(EC.hits.length<3?'Listening… clap '+(EC.hits.length+1)+' of 3':'Done · save, or clap again to replace the oldest');
  if(navigator.vibrate)navigator.vibrate(60);
}
function ecUI(state,msg){const s=$('#ecState');if(s&&state)s.textContent=state;const m=$('#ecMsg');if(m)m.innerHTML=msg||''}
function ecStop(){if(EC.proc){EC.proc.onaudioprocess=null;try{EC.proc.disconnect()}catch(e){}}if(EC.stream)EC.stream.getTracks().forEach(t=>t.stop());if(EC.ctx)EC.ctx.close().catch(()=>{});EC.proc=EC.stream=EC.ctx=null;EC.state='off';const v=$('#view-echo');if(v&&ST.view==='echo')renderEcho(v)}
XCOLS.ec={sheet:'Room echo',file:'Room_Echo_RT60',cols:[['Room',r=>r.label],['Room type',r=>r.type],['RT60 s',r=>r.rt],['Target s',r=>r.target],['Claps',r=>r.n],['Result',r=>ERW[r.rag]]]};

/* ================= home ================= */
const TOOLS=[
 ['live','Lux meter','Real-time light level from the phone camera','<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2"/>',()=>{const l=LV.log[LV.log.length-1];return l?'Last: '+f0(l.lux)+' lux':LV.log.length+' saved'}],
 ['sound','Sound meter','Real-time noise level in dB(A)','<path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/>',()=>{const l=SND.log[SND.log.length-1];return l?'Last: '+l.leq.toFixed(1)+' dB(A)':'0 saved'}],
 ['wifi','Wi-Fi speed test','Download, upload and latency, with a heatmap by zone','<path d="M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M2 9a15 15 0 0 1 20 0"/><circle cx="12" cy="19.5" r="1"/>',()=>{const l=logGet('wf');const r=l[l.length-1];return r?'Last: '+r.down.toFixed(0)+' Mbps · '+esc(r.zone||''):'0 tests'}],
 ['level','Level and slope','Floor level, ramp gradient (1:'+DB.ops.rampMax+') and plumb','<path d="M2 16h20M5 16l3-8h8l3 8"/><circle cx="12" cy="12" r="1.5"/>',()=>{const l=logGet('lvl');const r=l[l.length-1];return r?'Last: '+esc(r.txt):'0 saved'}],
 ['vib','Vibration meter','Floor and equipment vibration, tracked over time','<path d="M2 12h3l2-6 3 12 3-9 2 6 2-3h5"/>',()=>{const l=logGet('vib');const r=l[l.length-1];return r?'Last: '+r.rms.toFixed(3)+' m/s²':'0 saved'}],
 ['echo','Room echo test','How long sound lingers in a room (RT60), from a clap','<path d="M3 12h2M7 8v8M11 5v14M15 8v8M19 10v4"/>',()=>{const l=logGet('ec');const r=l[l.length-1];return r?'Last: '+r.rt.toFixed(2)+' s · '+esc(r.label||''):'0 saved'}]
];
function renderHome(el){
  el.innerHTML='<div class="tools">'+TOOLS.map(([v,n,d,ic,last])=>'<button class="tool" data-view-go="'+v+'"><span class="ti lx"><svg viewBox="0 0 24 24">'+ic+'</svg></span><span class="tn">'+n+'</span><span class="td">'+d+'</span><span class="tl">'+last()+'</span></button>').join('')+
    '</div><div class="hintp" style="text-align:center;margin-top:18px">Readings come from the phone\'s camera, microphone, motion sensor and network. Calibrate the lux and sound meters once per phone for best results. Everything is saved on this device.</div>';
}

/* ================= events ================= */
let vibTimer=null;
function opsStop(except){
  if(except!=='level')motionStop(lvlEvt);
  if(except!=='vib'){motionStop(vibEvt);if(vibTimer){clearInterval(vibTimer);vibTimer=null}VIB.timed=null}
  if(except!=='echo'&&EC.state!=='off')ecStop();
  if(except!=='wifi'&&WF.running&&WF.abort)WF.abort.abort();
}
document.addEventListener('click',async e=>{
  const t=e.target;
  const lx=t.closest('[data-logx]');if(lx){exportLog(lx.dataset.logx);return}
  const lc=t.closest('[data-logclr]');if(lc){if(confirm('Clear these saved readings?')){logClear(lc.dataset.logclr);render()}return}
  const wf=t.closest('[data-wf]');if(wf){if(WF.running){WF.abort.abort()}else wfRun();return}
  const lm=t.closest('[data-lmode]');if(lm){LVL.mode=lm.dataset.lmode;LVL.hold=false;renderLevel($('#view-level'));if(MOTION.handlers.has(lvlEvt))lvlDraw();return}
  const l2=t.closest('[data-lv2]');if(l2){const k=l2.dataset.lv2;
    if(k==='start'){if(await motionStart(lvlEvt,$('#lvlMsg'))){$('#lvlIdle').style.display='none';$('#lvlBtns').style.display='flex'}}
    else if(k==='hold'){LVL.hold=!LVL.hold;l2.textContent=LVL.hold?'Resume':'Hold'}
    else if(k==='zero'){const c=lvlCompute();if(!c){toast('No reading yet','Start first.',true);return}LVL.zero[LVL.mode]=LVL.mode==='plumb'?[c.raw[0]]:[c.raw[0],c.raw[1]];localStorage.setItem('lvl.zero',JSON.stringify(LVL.zero));toast('Zero set','Later readings in this mode are corrected.')}
    else if(k==='save'){const c=LVL.cur;if(!c){toast('No reading yet','Start first.',true);return}const r=lvlRes(c);const m=LVL.mode;
      const txt=m==='ramp'?(c.deg<0.05?'Level':'1:'+(1/Math.tan(c.deg*Math.PI/180)).toFixed(1)+' ('+(Math.tan(c.deg*Math.PI/180)*100).toFixed(1)+'%)'):c.mm.toFixed(1)+' mm/m';
      logPush('lvl',{label:valOf('lvlLabel'),mode:m,modeL:{surface:'Level',ramp:'Ramp slope',plumb:'Plumb'}[m],txt,deg:c.deg,mm:c.mm,rag:r,tol:m==='ramp'?'1:'+DB.ops.rampMax:(m==='plumb'?DB.ops.plumbTol:DB.ops.lvlTol)+' mm/m'});
      $('#lvlLabel').value='';toast('Reading saved',txt+' · '+LVW[r]);const cards=$('#view-level').querySelectorAll('.lvbelow>.card');cards[0].outerHTML=logTable('lvl','Saved readings',[{h:'Label',f:r=>esc(r.label||'')+'<div style="font-size:11.5px;color:var(--muted)">'+esc(r.modeL)+'</div>'},{h:'Reading',r:1,f:r=>esc(r.txt)},{h:'Angle',r:1,f:r=>r.deg.toFixed(2)+'°'},{h:'Result',f:r=>ragTxt(r.rag,LVW)}],'');renderNav()}
    return}
  const vb=t.closest('[data-vb]');if(vb){const k=vb.dataset.vb;
    if(k==='start'){if(await motionStart(vibEvt,$('#vbMsg'))){$('#vbIdle').style.display='none';$('#vbBtns').style.display='flex';VIB.buf=[];VIB.rmsHist=[];if(!vibTimer)vibTimer=setInterval(vibTick,250)}}
    else if(k==='stop'){motionStop(vibEvt);clearInterval(vibTimer);vibTimer=null;VIB.timed=null;$('#vbIdle').style.display='flex';$('#vbBtns').style.display='none'}
    else if(k==='hold'){VIB.hold=!VIB.hold;vb.textContent=VIB.hold?'Resume':'Hold'}
    else if(k==='timed'){if(VIB.timed){VIB.timed=null;vb.textContent='Measure 10 s';return}VIB.hold=false;VIB.acc=[];VIB.timed=Date.now()+10000}
    return}
  const ec=t.closest('[data-ec]');if(ec){const k=ec.dataset.ec;
    if(k==='start')ecStart();else if(k==='stop')ecStop();
    else if(k==='again'){EC.hits=[];renderEcho($('#view-echo'));ecUI('Listening for a clap…')}
    else if(k==='save'){if(!EC.hits.length){toast('No claps measured yet','Clap three times first.',true);return}const rt=EC.hits.reduce((a,b)=>a+b.rt,0)/EC.hits.length;const tp=ETYPE(EC.type);const rg=ecRag(rt);
      logPush('ec',{label:valOf('ecLabel'),type:tp?tp.l:'',target:tp?tp.rt:null,rt:+rt.toFixed(2),n:EC.hits.length,rag:rg});EC.hits=[];renderEcho($('#view-echo'));ecUI(EC.state==='off'?null:'Listening for a clap…');toast('Result saved','RT60 '+rt.toFixed(2)+' s · '+ERW[rg]);renderNav()}
    return}
});
document.addEventListener('change',e=>{
  if(e.target.id==='ecType'){EC.type=e.target.value;renderEcho($('#view-echo'));if(EC.state!=='off')ecUI('Listening for a clap…');return}
  if(e.target.dataset.ops){DB.ops[e.target.dataset.ops]=parseFloat(e.target.value)||0;save();return}
  if(e.target.dataset.etype){const [i,k]=e.target.dataset.etype.split('|');DB.echoTypes[+i][k]=k==='l'?e.target.value.trim():parseFloat(e.target.value)||0;save();return}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)opsStop('none')});
/* boot (after all modules) */
render();

</script></body></html>
